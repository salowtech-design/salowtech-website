<style>
*{box-sizing:border-box}

 if(i==1)return '<div class="hd">Attendance today<b class="cnt" data-to="94" data-pre="" data-suf="%" data-dec="0">0%</b></div><div class="av">'+AV.map(function(a,k){return '<i class="'+(k==6||k==11?'l':'')+'" style="--k:'+k+'">'+a+'</i>'}).join('')+'</div><div class="pay">Payroll for October<span class="rd">Ready to pay ✓</span><div class="pb"><u></u></div></div>';
 if(i==2)return '<div class="hd">Revenue this year<b class="cnt" data-to="1.8" data-pre="$" data-suf="M" data-dec="1">$0M</b></div><div class="ch">'+[40,55,48,70,62,85,100].map(function(h,k){return '<i style="--h:'+h+'%;--k:'+k+'"></i>'}).join('')+'</div><div class="inv" style="--k:0">INV-1042<span>Paid ✓</span></div><div class="inv" style="--k:1">INV-1043<span class="s">Sent</span></div><div class="inv" style="--k:2">Stock level<span>Healthy ✓</span></div>';
 if(i==3)return '<div class="hd">Tasks done today<b class="cnt" data-to="1240" data-pre="" data-suf="" data-dec="0">0</b></div><div class="ct"><div class="b u">Need a demo for our team of 20</div><div class="ar"><div class="dots"><i></i><i></i><i></i></div><div class="b a">Sure! I booked a demo for tomorrow at 4 PM and sent you the details.</div></div></div><div class="st">● Agent online, working 24/7</div>';
 if(i==4){var N=[['#7a4fd6','T','Trigger: New lead'],['#e0782f','C','Add to CRM'],['#AD8B73','@','Send welcome email'],['#2e9e5b','N','Notify the team']];
  return '<div class="hd">Active workflows<b class="cnt" data-to="36" data-pre="" data-suf="" data-dec="0">0</b></div><div class="fl">'+N.map(function(n,k){return (k?'<div class="ln" style="--k:'+(k-1)+'"></div>':'')+'<div class="nd" style="--k:'+k+'"><u style="background:'+n[0]+'">'+n[1]+'</u>'+n[2]+'<em>✓</em></div>'}).join('')+'</div>';}
 return '<div class="cl"><u>📞</u><div>Incoming call<small>Voice Assistant answering</small></div></div><div class="wv">'+Array.apply(null,Array(22)).map(function(_,k){return '<i style="--k:'+k+'"></i>'}).join('')+'</div><div class="tx">“Please book a meeting for tomorrow at 4 PM.”</div><div class="ok">✓ Meeting booked, 4:00 PM</div><div class="ok o2">✓ Call logged to CRM</div>';
}
function cnt(root){root.querySelectorAll('.cnt').forEach(function(el){var to=+el.dataset.to,dec=+el.dataset.dec,t0=performance.now();(function f(t){if(isPaused)return;var p=Math.min(1,(t-t0)/1200),v=to*(1-Math.pow(1-p,3));el.textContent=el.dataset.pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString('en-US'))+el.dataset.suf;if(p<1)requestAnimationFrame(f)})(t0)})}
function render2(m,i){panel.innerHTML='<div class="left"><div class="lab">'+m.l+'</div><h3>'+m.h+'</h3><p>'+m.d+'</p><ul>'+m.p.map(function(x){return '<li><i>✓</i>'+x+'</li>'}).join('')+'</ul></div><div class="viz v">'+V(i)+'</div>';cnt(panel)}
var cachedCoords=null;
function cacheItemCoords(){if(!stage||!items.length)return;var s=stage.getBoundingClientRect();cachedCoords=items.map(function(item){var r=item.getBoundingClientRect();return{left:(r.left-s.left+r.width*.6)+"px",top:(r.top-s.top+r.height*.5)+"px"}})}
function moveTo(el,index){if(cachedCoords&&typeof index==='number'&&cachedCoords[index]){cur.style.left=cachedCoords[index].left;cur.style.top=cachedCoords[index].top;return}var s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();cur.style.left=(r.left-s.left+r.width*.6)+"px";cur.style.top=(r.top-s.top+r.height*.5)+"px"}
var isPaused = false;
var isRunning = false;

async function run(){
 if (isPaused || isRunning) return;
 isRunning = true;
 try {
  C.add("snap");C.remove("in","merge","flash","open","win");cur.classList.remove("on","press");items.forEach(function(t){t.classList.remove("act","rip")});panel.innerHTML="";
  await sleep(20);
  C.remove("snap");
  await sleep(100);C.add("in");await sleep(2100);
  if (isPaused) return;
  C.add("merge");await sleep(1700);
  fx();await sleep(500);
  C.add("open");await sleep(300);C.add("win");await sleep(800);
  cur.style.left=stage.clientWidth*.8+"px";cur.style.top=stage.clientHeight*.9+"px";cur.classList.add("on");await sleep(100);
  cacheItemCoords();
  for(var i=0;i<mods.length;i++){
   if (isPaused) return;
   moveTo(items[i], i);await sleep(900);
   cur.classList.add("press");items[i].classList.remove("rip");
   requestAnimationFrame((function(elem){ return function(){ elem.classList.add("rip"); }; })(items[i]));
   items.forEach(function(t){t.classList.remove("act")});items[i].classList.add("act");panel.classList.add("sw");await sleep(330);render2(mods[i],i);panel.classList.remove("sw");
   await sleep(150);cur.classList.remove("press");await sleep(250);
   var lis=panel.querySelectorAll("li");for(var j=0;j<lis.length;j++){lis[j].classList.add("show");await sleep(380)}
   await sleep(2400);
  }
  cur.classList.remove("on");C.remove("win");await sleep(1000);
  C.remove("open");await sleep(800);fx();await sleep(1400);C.remove("in");await sleep(900);
 } finally {
  isRunning = false;
 }
 if (!isPaused) {
  run();
 }
}

function triggerRun() {
  isPaused = false;
  if (!isRunning) {
    run();
  }
}

// Initial layout and start
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", function() {
    place();
    triggerRun();
  });
} else {
  place();
  triggerRun();
}
window.addEventListener("load", function() {
  place();
  triggerRun();
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage('salowtech-promo-ready', '*');
    }
  } catch(e) {}
});

// Play/pause when message received from parent page scroll observer
window.addEventListener("message", function(e) {
  var data = e.data;
  if (typeof data === "object" && data !== null) {
    data = data.action || data.type || "";
  }
  if (data === "pause") {
    isPaused = true;
  } else if (data === "play" || data === "start") {
    isPaused = false;
    triggerRun();
  }
});

// Direct viewport fallback
if ("IntersectionObserver" in window) {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        isPaused = false;
        triggerRun();
      } else {
        // Only pause if standalone page
        if (!window.parent || window.parent === window) {
          isPaused = true;
        }
      }
    });
  }, { threshold: 0.1 });
  obs.observe(stage);
}
